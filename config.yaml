# =================================================================
# TriggerForge 运行配置
# =================================================================

# 私有插件存放根目录：引擎会在 {plugin_directory}/{plugin_name}/main.py
# 下查找插件入口文件
plugin_directory: "./plugins"

# 监控目录策略列表（支持配置多个独立的监控目录）
watch_folders:
  - # 1. 引擎实施事件监听的源目标目录（投递文件到该目录即触发插件流水线）
    path: "./storage/watch_folder"

    # 2. 插件成功执行完毕后，源文件将被自动移动至该归档目录
    success_path: "./storage/success_folder"

    # 3. 插件执行失败或超时熔断后，源文件将被自动移动至该故障隔离目录
    error_path: "./storage/error_folder"

    # 4. 该监控目录分配的独立工作线程数量
    concurrency: 2

    # 5. 文件写入防抖窗口（秒）：等待文件写入完成后再触发流水线
    debounce_seconds: 1.0

    # 6. 该目录事件触发后，按顺序串行执行的插件策略流水线
    strategies:
      # 示例策略：test_echo 插件（未找到时引擎会自动生成默认回显插件）
      - plugin_name: "test_echo"
        plugin_version: "1.0.0"
        timeout: 15
        params:
          mode: "default"
